<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240">
  <defs>
    <clipPath id="rounded-cover">
      <path d="M21 2 H299 Q318 2 318 21 V142 H2 V21 Q2 2 21 2 Z" />
    </clipPath>
  </defs>

  <rect x="1" y="1" width="318" height="238" rx="20" fill="black" stroke="transparent" stroke-width="3" style="cursor: pointer;">
    <animate attributeName="stroke" values="transparent;#9333ea;transparent" dur="0.3s" begin="mouseover" fill="freeze" />
    <animate attributeName="stroke" values="#9333ea;transparent" dur="0.3s" begin="mouseout" fill="freeze" />
  </rect>

  

  <text x="20" y="175" fill="white" font-family="Arial, sans-serif" font-weight="bold" font-size="18">Heading goes here</text>
  <text x="20" y="198" fill="white" font-family="Arial, sans-serif" font-size="12">
    <tspan x="20" dy="0">This is a small paragraph describing</tspan>
    <tspan x="20" dy="16">the heading in more detail.</tspan>
  </text>
</svg>
